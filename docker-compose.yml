# Sobe os 3 bancos localmente: docker compose up -d
services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongo_data:/data/db]

  redis:
    image: redis:7
    ports: ["6379:6379"]

  neo4j:
    image: neo4j:5
    ports: ["7474:7474", "7687:7687"]   # 7474 = Neo4j Browser (visualizar o grafo)
    environment:
      NEO4J_AUTH: neo4j/senha12345
    volumes: [neo4j_data:/data]

volumes:
  mongo_data:
  neo4j_data:
